[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leen"
version = "0.1.0"
description = "Local Equivariant Energy Network for protein stability prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.1",
    "biopython>=1.83",
    "datasets>=2.16",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "wandb>=0.16",
    "pytest>=7.4",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["leen*"]
